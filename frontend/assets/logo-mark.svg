<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB020"/>
      <stop offset="0.55" stop-color="#F57C00"/>
      <stop offset="1" stop-color="#E64A19"/>
    </linearGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="2" flood-color="#7A2E00" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#bg)"/>
  <g filter="url(#ds)" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- left loop -->
    <circle cx="34" cy="52" r="14"/>
    <!-- right loop (open at top-right where the arrow exits) -->
    <path d="M 56 44 A 14 14 0 1 1 75 38"/>
    <!-- arrow shaft sweeping up to the top-right -->
    <path d="M 75 38 L 85 27"/>
  </g>
  <!-- arrowhead -->
  <path d="M 92 19 L 91 32 L 79 22 Z" fill="#fff" filter="url(#ds)"/>
</svg>